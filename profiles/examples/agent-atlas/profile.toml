[slots.priority-rubric.priority_quota]
items = []
mode = "none"

[slots.priority-rubric.profile_owned_grant_criteria.P0]
mode = "configured"
predicate = "The page's exact repository-relative path appears in `canonical_markdown_paths` for at least one `P0` capability in the Profile-bound Capability Matrix, and that capability is necessary to satisfy a declared Atlas goal. If a page qualifies for both P0 and P1, P0 takes precedence."
protected_capability = "The reader can understand, design, verify, operate, diagnose, and recover the core end-to-end Agent and Harness system described by Atlas."

[slots.priority-rubric.profile_owned_grant_criteria.P1]
mode = "configured"
predicate = "The page is not P0 and its exact repository-relative path either appears in `canonical_markdown_paths` for a `P1` capability, appears in `evidence_paths` for a `P0` capability, or is the canonical page of a Global Map entry whose typed dependency directly feeds an entry used by a `P0` capability through `prerequisite-for`, `evidence-input-to`, `control-input-to`, `system-input-to`, or `canonical-source-for`. A derived Expression artifact or its readiness is not a grant condition."
protected_capability = "The reader can explain and defend the mechanisms, prerequisites, evidence, tradeoffs, failure modes, safety boundaries, and evaluation methods that directly support those core capabilities."

[[slots.profile-scope.content_priority_factors]]
factor = "Knowledge required to design, execute, verify, or recover an end-to-end Agent or LLM system."
