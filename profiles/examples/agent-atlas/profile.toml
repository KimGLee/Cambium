[slots.language-contract]
content_length_unit = "characters"

[slots.language-contract.canonical_naming]
folders = "English Title Case with spaces; preserve official casing."
image_assets = "Lowercase English kebab-case; use the owning page slug as the prefix when practical."
pages = "English Title Case or official casing with spaces."
term_notes = "The most common official English term or industry-standard acronym, using conventional casing and punctuation."

[slots.language-contract.formatting_migration_invalidations]
items = []
mode = "none"

[slots.language-contract.language_routing]
body_language = "Simplified Chinese (`zh-Hans`)."
external_names = "Keep the official product, project, model, protocol, organization, or publication name unchanged."
machine_identifiers = "Keep identifiers, commands, fields, paths, formulas, and configuration literals exact and format them as code."
proper_names = "Preserve the official name and add a concise Chinese explanation at first meaningful use when needed."

[slots.language-contract.language_routing.secondary_language]
mode = "configured"
rule = "English preserves official external identities, source-language claims, and machine interfaces; Chinese is the canonical explanatory language."

[slots.language-contract.scoped_anti_pattern_extensions]
items = []
mode = "none"

[slots.language-contract.terminology_and_display]
abbreviations = "Expand once on first use per page, with a Chinese explanation when needed; use the abbreviation thereafter."
aliases = "Include the official full form, accepted acronym, common Chinese name, and materially distinct established synonyms."
display_order = "Present the Chinese explanation around the preserved official or machine identity."
file_annotations = "None — file names carry only the canonical title."
headings = "Use concise stable headings; explanatory labels are Chinese, while official identities remain unchanged."

