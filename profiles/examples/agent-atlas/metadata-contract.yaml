# Atlas values for the Kernel-owned Metadata Contract slot.

schema_version: 1

applicability:
  state: configured

applicability_differences: []

extension_fields:
  - field: interview_guide
    mode: optional
    shape: path
    owner: "profiles/examples/agent-atlas/expression-layer.md"
  - field: case_class
    mode: conditional
    shape: nonempty-string
    condition:
      all:
        - field: type
          in:
            - case-study
    owner: "profiles/examples/agent-atlas/scope-and-architecture.md"
  - field: source_class
    mode: conditional
    shape: nonempty-string
    condition:
      all:
        - field: type
          in:
            - source-note
    owner: "profiles/examples/agent-atlas/source-policy.md"

relationship_extensions:
  - field: canonical_bindings
    mode: optional
    direction: expression-to-canonical
    target: page
    shape: list-of-paths
    owner: "profiles/examples/agent-atlas/expression-layer.md"

section_roles:
  - role: sources
    titles:
      - "Sources（来源）"
      - "来源"
    aliases:
      - "Sources"
    owner: "profiles/examples/agent-atlas/language-contract.md"
  - role: related
    titles:
      - "Related（相关）"
      - "相关"
    aliases:
      - "Related"
      - "Related（相关内容）"
    owner: "profiles/examples/agent-atlas/language-contract.md"
