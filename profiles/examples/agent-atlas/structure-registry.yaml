# Agent Atlas Structure Registry — the selected profile's structural units
# (K01/05) and support layers (K01/06).
# Interface: kernel/K00 Standards Control/profile-interface.yaml
# The registry declares the current target state; the `structure-registry`
# Gate proves that the adopting repository agrees with it.
# The eleven Global Map submodule entries satisfy the K01/05 admission test:
# each has a unique registered
# responsibility, a canonical entry, one parent, Coverage projectability,
# and independent maintenance history, so all eleven register as modules.
# No other first-level directory passes the test; unregistered directories
# stay ordinary groupings covered by their parent's entry.

schema_version: 2

applicability:
  state: configured
  reason: null

