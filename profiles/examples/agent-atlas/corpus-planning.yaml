# Atlas values for the Kernel-owned Corpus Planning slot.

schema_version: 1

applicability:
  state: configured
  reason: null

artifact_bindings:
  global_map: "Corpus Planning/global_map.yaml"
  capability_matrix: "Corpus Planning/capability_matrix.yaml"
  gap_register: "Corpus Planning/gap_register.yaml"

capability_scale:
  - rank: 0
    value: "0 Missing"
    predicate: "No canonical owner exists."
    target_eligible: false
  - rank: 1
    value: "1 Outline"
    predicate: "A definition or outline exists, but mechanism and boundaries are incomplete."
    target_eligible: false
  - rank: 2
    value: "2 Core"
    predicate: "The canonical owner explains the core mechanism and common decision boundary."
    target_eligible: true
  - rank: 3
    value: "3 System"
    predicate: "The capability connects interfaces, state, failures, and evaluation through a system path."
    target_eligible: true
  - rank: 4
    value: "4 Defensible"
    predicate: "The capability has a complete evidence chain for its bounded claims."
    target_eligible: true

pass_authority:
  role_id: stopper
  decision_scope_id: corpus-plan-semantic-acceptance
