# Machine matching parameters for the Agent Atlas residual-content scan.
# Scan identity, activation, candidate semantics, and judgment binding remain
# owned by registries/registered-scans.md.

residual_scan_config_version: 1

allowed_roots:
  - Interview Preparation

excluded_roots:
  - .obsidian
  - Archive
  - Knowledge Base Standards
  - Python Algorithm Agent Training
  - Tools
  - kernel
  - profiles

frontmatter_match:
  field: type
  values:
    - interview-card

# The generic matcher strips Markdown heading syntax only: numbering,
# parentheticals, and bilingual suffixes are NOT removed. `Required Card
# Structure` in ../expression-layer.md mandates the compound `English（中文）`
# form, so each mandated form is registered verbatim below alongside the bare
# and CJK-only variants that legacy and partially migrated pages still carry.
# Dropping a mandated form here does not weaken the scan quietly:
# `mandated_headings` makes it a hard configuration error.
#
# Placement follows the same rule the bare forms already used: a heading that
# alone identifies an Interview Card goes in `any`; a heading that also occurs
# in ordinary knowledge pages goes in `combination`, where two distinct hits
# are needed.
heading_match:
  any:
    - Interview Card
    - Interview Answer
    - Interview Answer（待迁移）
    - Interview Question
    - 30-Second Answer
    - 30-Second Answer（30 秒回答）
    - 90-Second Answer
    - 90-Second Answer（90 秒回答）
    - Common Follow-ups
    - Common Follow-ups（常见追问）
    - Common Followups
    - Follow-up Answers
    - Follow-up Answers（追问答案）
    - Strong Answer Signals
    - Strong Answer Signals（强回答信号）
    - Weak Answer Signals
    - Weak Answer Signals（弱回答信号）
    - Related Interview Cards（相关面试卡片）
    - 面试卡
    - 面试卡片
    - 面试回答
    - 面试问题
    - 30 秒回答
    - 90 秒回答
    - 常见追问
    - 追问答案
    - 强回答信号
    - 弱回答信号
  combination:
    - Core Knowledge Links
    - Core Knowledge Links（核心知识链接）
    - Deep Dive Follow-up Tree
    - Deep-Dive Follow-up Tree（深挖追问树）
    - Common Misconceptions
    - Common Misconceptions（常见误解）
    - Comparison Questions
    - Comparison Questions（比较类问题）
    - Scenario Questions
    - Scenario Questions（场景类问题）
    - Self-test Questions
    - Self-test Questions（自测问题）
    - Scope（范围）
    - Knowledge Prerequisites（知识前置）
    - 核心知识链接
    - 深挖追问树
    - 常见误解
    - 比较类问题
    - 场景类问题
    - 自测问题
  minimum_distinct: 2

# The Card sections that `Required Card Structure` in ../expression-layer.md
# mandates for every Interview Card, transcribed verbatim and in that order.
# The two indented rows under the 30-/90-second sections (`English（英文回答）`
# and `中文`) are bilingual sub-headings inside those sections rather than Card
# sections of their own, and are generic enough that registering them as
# matchers would fire on most bilingual pages; the bilingual parity they carry
# is owned by ../language-contract.md, not by this scan.
#
# The tool proves every entry below is matchable in heading_match and that a
# page carrying exactly this set classifies as a candidate; it does not judge
# whether this list is the right one, which stays this profile's call.
mandated_headings:
  - Scope（范围）
  - Knowledge Prerequisites（知识前置）
  - Core Knowledge Links（核心知识链接）
  - 30-Second Answer（30 秒回答）
  - 90-Second Answer（90 秒回答）
  - Deep-Dive Follow-up Tree（深挖追问树）
  - Follow-up Answers（追问答案）
  - Common Misconceptions（常见误解）
  - Strong Answer Signals（强回答信号）
  - Weak Answer Signals（弱回答信号）
  - Comparison Questions（比较类问题）
  - Scenario Questions（场景类问题）
  - Self-test Questions（自测问题）
  - Related Interview Cards（相关面试卡片）
