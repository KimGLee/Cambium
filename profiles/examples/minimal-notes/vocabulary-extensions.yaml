# Minimal Notes profile vocabulary extensions.
# Interface: profiles/README.md#Vocabulary-Extensions-Slot
#
# This profile registers no kernel-field extension and no profile-owned field:
# the readiness-axis mapping shipped by profiles/_template/ has been deleted
# because no registered expression artifact uses a readiness axis (see
# expression-layer.md). `volatility_defaults` is the only required registration;
# the composer derives the domain vocabulary from its keys.

schema_version: 1

# No freeform profile fields.
frontmatter_extensions:
  fields: []

fields:

# key = domain ID; value = fast | slow | stable
volatility_defaults:
  home-network: slow
