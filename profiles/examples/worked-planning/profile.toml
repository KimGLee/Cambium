[slots.source-policy.domain_comparison_rules]
mode = "configured"

[[slots.source-policy.domain_comparison_rules.items]]
condition = "A retained bench measurement disagrees with a published figure."
rule = "The published figure stays canonical; the measurement is retained with its date and the disagreement is recorded as a gap candidate rather than silently resolved."

[[slots.source-policy.domain_comparison_rules.items]]
condition = "Two held document revisions give different figures for the same hub family."
rule = "The newer revision is canonical from its arrival date; pages quoting the older revision are listed for re-check before the newer figure is adopted."

[slots.source-policy.provenance_extensions]
items = []
mode = "none"

[[slots.source-policy.source_authority]]
claim_class = "Torque figures, preload rules, and the published service sequence for that hub family."
location = "the manufacturer service manual held in the workshop for each stocked hub family."
rank = 1
source_id = "hub-service-manual"
version_policy = "The revision printed on the manual's cover."

[[slots.source-policy.source_authority]]
claim_class = "Published maximum spoke tension and the rim's effective diameter."
location = "the rim manufacturer's technical sheet for a stocked rim."
rank = 2
source_id = "rim-tech-sheet"
version_policy = "The sheet's publication date."

[[slots.source-policy.source_authority]]
claim_class = "What was actually observed on one wheel on one date."
location = "a measurement retained on a completed service case."
rank = 3
source_id = "bench-measurement"
version_policy = "The service date recorded on the case page."

[[slots.source-policy.staleness_triggers]]
affected_scope = "Every quoted torque or preload figure whose page names the superseded revision, and every service case whose parts or tooling assumptions came from it."
event = "A newer service manual revision reaches the workshop."

[[slots.source-policy.staleness_triggers]]
affected_scope = "The working range on the spoke tension page and any capability whose evidence depends on it."
event = "A new rim model enters stock."

[[slots.source-policy.verification_entry_points]]
claim_class = "A torque or preload figure quoted by a procedure page."
freshness = "Re-check whenever a newer revision reaches the workshop."
source_id = "hub-service-manual"
verification = "Open the manual revision named on the page and read the figure from its own table."

[[slots.source-policy.verification_entry_points]]
claim_class = "A maximum-tension figure used to derive a working range."
freshness = "Re-check per rim model when stock changes."
source_id = "rim-tech-sheet"
verification = "Read the published maximum from the sheet for that exact rim model."

[[slots.source-policy.verification_entry_points]]
claim_class = "A claim about how long a service takes."
freshness = "24 months."
source_id = "bench-measurement"
verification = "Read the retained bench time from the cited service case."

