mode = "none"

[slots.language-contract]
content_length_unit = "words"

[slots.language-contract.canonical_naming]
folders = "English, Title Case, spaces."
image_assets = "English, lowercase, hyphens; the owning page's slug is the prefix."
pages = "English, Title Case, spaces."
term_notes = "English, Title Case, spaces; the manufacturer's casing wins when it differs."

[slots.language-contract.formatting_migration_invalidations]
items = []
mode = "none"

[slots.language-contract.language_routing]
body_language = "English (`en`)."
external_names = "The product name exactly as printed on the service document, followed by the workshop's shelf label in parentheses on first use per page."
machine_identifiers = "Part numbers, document revisions, and tool sizes appear in backticks and are never re-cased."
proper_names = "The manufacturer's own spelling everywhere, including headings and tables."

[slots.language-contract.language_routing.secondary_language]
mode = "none"

[slots.language-contract.scoped_anti_pattern_extensions]
items = []
mode = "none"

[slots.language-contract.terminology_and_display]
abbreviations = "Expanded once per page on first use, then the abbreviation alone."
aliases = "The shelf label and the printed product name are both registered as aliases."
display_order = "What is being decided, how it is observed, what is done, how the result is checked."
file_annotations = "None — the file name carries the title only."
headings = "Sentence case, no trailing punctuation."

[slots.metadata-contract]
applicability_differences = []
extension_fields = []
relationship_extensions = []
schema_version = 1
section_roles = []

[slots.metadata-contract.applicability]
state = "kernel-defaults"

[slots.priority-rubric.priority_quota]
mode = "configured"

[[slots.priority-rubric.priority_quota.items]]
maximum_share = 0.1
priority = "P0"
rationale = "A service corpus keeps its always-verified core deliberately small; ten percent of the pages carry the procedures a mechanic opens with a customer waiting"

[[slots.priority-rubric.priority_quota.items]]
maximum_share = 0.3
priority = "P1"
rationale = "The workshop reserves a bounded supporting tier for evidence and operating context while keeping supplementary P2 material as the corpus majority"

[slots.priority-rubric.profile_owned_grant_criteria.P0]
mode = "configured"
predicate = "The page is named as a canonical path by a `P0` capability in the Capability Matrix, and a volunteer cannot reach that capability's finish condition without it."
protected_capability = "A trained volunteer completes a member's service unattended in the session it was booked for."

[slots.priority-rubric.profile_owned_grant_criteria.P1]
mode = "configured"
predicate = "The page is named by a `P1` capability, or it is the source note a `P0` capability quotes its published figures from."
protected_capability = "The workshop can still stand behind a quoted figure at the next service, up to one document revision later."

[[slots.profile-scope.content_priority_factors]]
factor = "A volunteer is standing at the bench with a member's wheel and needs the answer now."
rank = 1

[[slots.profile-scope.content_priority_factors]]
factor = "The answer commits the workshop to a part order or to a figure it must stand behind."
rank = 2

[[slots.profile-scope.content_priority_factors]]
factor = "The answer explains why an existing procedure is written the way it is."
rank = 3

[slots.profile-scope.dependency_ordered_build_sequence]
mode = "configured"

[[slots.profile-scope.dependency_ordered_build_sequence.items]]
depends_on = []
output = "The distinctions every procedure page may assume."
stage = "Foundation concepts a decision depends on"

[[slots.profile-scope.dependency_ordered_build_sequence.items]]
depends_on = [
    "Stage 1",
]
output = "Procedures a trained volunteer can follow unattended."
stage = "Bench procedures with finish conditions"

[[slots.profile-scope.dependency_ordered_build_sequence.items]]
depends_on = [
    "Stage 2",
]
output = "Every quoted figure traced to a document revision."
stage = "Source notes naming canonical documents"

[[slots.profile-scope.dependency_ordered_build_sequence.items]]
depends_on = [
    "Stages 2 and 3",
]
output = "Evidence that closes the capability's evidence requirement."
stage = "Worked service cases with retained measurements"

[slots.profile-scope.excluded_scope]
mode = "configured"

[[slots.profile-scope.excluded_scope.items]]
content = "Frame and fork structural repair."
handling = "Referred out; the workshop does not perform it and keeps no guidance for it."

[[slots.profile-scope.excluded_scope.items]]
content = "Member records, membership fees, and rota scheduling."
handling = "The workshop's separate administrative system."

[[slots.profile-scope.foundation_depth_requirements]]
page_class = "A page a procedure depends on for a decision."
predicate = "The page states the distinction being made, how a volunteer observes it at the bench, what downstream decision changes because of it, and which source note is canonical for its published figures."

[slots.profile-scope.goal]
readers = [
    "Trained workshop volunteers, and the service lead who accepts their work.",
]
statement = "Let any trained volunteer at a community bicycle workshop decide, perform, and stand behind a wheel service without asking the one person who has done it before."

[slots.profile-scope.knowledge_spine]
locator = "The Global Map entry's typed dependency edges; every page is the downstream end of at least one."
organizing_logic = "Concept, then procedure that applies it, then case that evidences it, with source notes naming what each figure is quoted from."

[[slots.profile-scope.logical_architecture]]
directories = [
    "profiles/examples/worked-planning/corpus/Foundations",
]
layer_id = "L-FOUNDATION"
responsibility = "Own the concepts a service decision depends on, independent of any one procedure."

[[slots.profile-scope.logical_architecture]]
directories = [
    "profiles/examples/worked-planning/corpus/Procedures",
]
layer_id = "L-PROCEDURE"
responsibility = "Own the bench procedures, each with its own finish condition."

[[slots.profile-scope.logical_architecture]]
directories = [
    "profiles/examples/worked-planning/corpus/Service Cases",
]
layer_id = "L-CASES"
responsibility = "Own completed services as worked cases with retained measurements."

[[slots.profile-scope.logical_architecture]]
directories = [
    "profiles/examples/worked-planning/corpus/Source Notes",
]
layer_id = "L-SOURCES"
responsibility = "Own which external documents are canonical and what each is canonical for."

[[slots.profile-scope.new_page_placement_rule]]
fallback = false
layer_id = "L-CASES"
predicate = "The page records one completed service on one member's machine."

[[slots.profile-scope.new_page_placement_rule]]
fallback = false
layer_id = "L-SOURCES"
predicate = "The page states what an external document is canonical for."

[[slots.profile-scope.new_page_placement_rule]]
fallback = false
layer_id = "L-PROCEDURE"
predicate = "The page ends in a bench finish condition."

[[slots.profile-scope.new_page_placement_rule]]
