[slots.profile-scope.representative_sample_plan]
mode = "configured"

[[slots.profile-scope.representative_sample_plan.items]]
note_type = "Bench procedure"
selection_predicate = "The procedure most recently run by a volunteer who had not run it before."

[[slots.profile-scope.representative_sample_plan.items]]
note_type = "Service case"
selection_predicate = "The most recent case whose retained measurements are cited as evidence by a capability."

[[slots.profile-scope.terminology_structure]]
boundary = "Included when two procedures depend on the same distinction; excluded when only one procedure uses the word and its meaning is local to that bench step."
layer_id = "L-FOUNDATION"
term_class = "Bearing families and wheel-geometry terms used by more than one procedure."

[[slots.registered-scan-registry.scan_registrations]]
activation_role = "K12/09 item 6 — residual-content scan"
candidate_predicate = "A Markdown file outside the case layer is a candidate when it declares `type: service-case`, carries a `Service Case Log` heading, or carries at least two distinct case-only structure headings. The scan is candidate-only; adjudication belongs to `worked-planning-case-residual-disposition`."
configuration_ref = "profiles/examples/worked-planning/scan-configs/residual-scan.yaml"
judgment_item_id = "worked-planning-case-residual-disposition"
scan_id = "worked-planning-case-residuals"
scope = "Run from the vault root; the profile-owned configuration accepts the case layer as the only root where service-case structure belongs and excludes the control plane."
verifier_capability = "residual-content-scan-v1"

