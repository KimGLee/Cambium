# Example Profile answers. This example is not selected or an adoption certificate.
profile_id = "worked-planning"
schema_version = 1

[execution_default_overrides]
concurrency_cap = 1

[slots.audit-dimension-registry.extension_dimensions]
items = []
mode = "none"

[[slots.audit-dimension-registry.judgment_items]]
audit_layer = "Module Review"
audit_object = "The foundation pages one procedure depends on satisfy the registered depth predicate."
dimension_id = "content_and_depth"
evidence_role = "emits"
item_id = "worked-planning-foundation-depth"
predicate_owner = "profiles/examples/worked-planning/profile.toml#slots.profile-scope.foundation_depth_requirements"

[[slots.audit-dimension-registry.judgment_items]]
audit_layer = "Batch Review"
audit_object = "Every service-case-structure candidate the registered scan reports outside the case layer has an accepted disposition."
dimension_id = "coverage_and_integration"
evidence_role = "emits"
item_id = "worked-planning-case-residual-disposition"
predicate_owner = "profiles/examples/worked-planning/policies/residual-disposition.md#Case Residual Disposition"

[[slots.audit-dimension-registry.judgment_items]]
audit_layer = "Module Review"
audit_object = "Every Capability Matrix row above the lowest scale rank names evidence paths that resolve in the reviewed snapshot."
dimension_id = "source_and_currentness"
evidence_role = "consumes"
item_id = "worked-planning-capability-evidence-resolves"
predicate_owner = "profiles/examples/worked-planning/policies/residual-disposition.md#Capability Evidence Resolves"

[[slots.audit-dimension-registry.judgment_items]]
audit_layer = "Module Review"
audit_object = "Pages quoting a figure from a superseded document revision are raised as review candidates."
dimension_id = "source_and_currentness"
evidence_role = "triggers"
item_id = "worked-planning-source-revision-drift"
predicate_owner = "profiles/examples/worked-planning/policies/residual-disposition.md#Source Revision Drift"

[slots.audit-dimension-registry.residual_disposition]
body_ref = "profiles/examples/worked-planning/policies/residual-disposition.md#Residual Disposition"

[slots.corpus-planning]
schema_version = 1

[slots.corpus-planning.applicability]
state = "configured"

[slots.corpus-planning.artifact_bindings]
capability_matrix = "profiles/examples/worked-planning/planning/capability_matrix.yaml"
gap_register = "profiles/examples/worked-planning/planning/gap_register.yaml"
global_map = "profiles/examples/worked-planning/planning/global_map.yaml"

[[slots.corpus-planning.capability_scale]]
predicate = "No page owns the capability; a volunteer has to ask someone."
rank = 0
target_eligible = false
value = "0 Absent"

[[slots.corpus-planning.capability_scale]]
predicate = "A page names the decision but does not carry enough to act on unattended."
rank = 1
target_eligible = false
value = "1 Outline"

[[slots.corpus-planning.capability_scale]]
predicate = "A trained volunteer can complete the work unattended and reach the page's own finish condition."
rank = 2
target_eligible = true
value = "2 Working"

[[slots.corpus-planning.capability_scale]]
predicate = "The capability's figures trace to a named source revision and at least one completed case retains the measurements that back it."
rank = 3
target_eligible = true
value = "3 Verified"

[slots.corpus-planning.pass_authority]
decision_scope_id = "corpus-plan-semantic-acceptance"
role_id = "service-lead"

[slots.escalation-policy.escalation_triggers]
items = []
mode = "none"

