# Worked Planning corpus-planning slot: the configured branch.
# Interface: profiles/README.md#Corpus-Planning-Slot
# The three bindings below are the only place this profile names the planning
# artifacts; K02/05-07 own their record contracts.

schema_version: 1

applicability:
  state: configured
  reason: null

artifact_bindings:
  global_map: "profiles/examples/worked-planning/planning/global_map.yaml"
  capability_matrix: "profiles/examples/worked-planning/planning/capability_matrix.yaml"
  gap_register: "profiles/examples/worked-planning/planning/gap_register.yaml"

capability_scale:
  - rank: 0
    value: "0 Absent"
    predicate: "No page owns the capability; a volunteer has to ask someone."
    target_eligible: false
  - rank: 1
    value: "1 Outline"
    predicate: "A page names the decision but does not carry enough to act on unattended."
    target_eligible: false
  - rank: 2
    value: "2 Working"
    predicate: "A trained volunteer can complete the work unattended and reach the page's own finish condition."
    target_eligible: true
  - rank: 3
    value: "3 Verified"
    predicate: "The capability's figures trace to a named source revision and at least one completed case retains the measurements that back it."
    target_eligible: true

pass_authority:
  role_id: service-lead
  decision_scope_id: corpus-plan-semantic-acceptance
