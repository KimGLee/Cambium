name: verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: plan affected verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      run_tests: ${{ steps.plan.outputs.run_tests }}
      check_matrix: ${{ steps.plan.outputs.check_matrix }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up planning Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Compute fail-closed impact plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python .github/scripts/ci_impact.py plan \
            --root . \
            --event "${{ github.event_name }}" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --plan-path "$RUNNER_TEMP/ci-plan.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish selection rationale
        run: |
          echo '## CI impact plan' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/ci-plan.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Planning must leave the tree unchanged
        if: ${{ always() }}
        run: |
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/worktree-status"
          if test -s "$RUNNER_TEMP/worktree-status"; then
            echo "CI planning modified tracked or untracked non-ignored files:"
            cat "$RUNNER_TEMP/worktree-status"
            exit 1
          fi

  verify_check:
    name: verify check (${{ matrix.python-version }})
    needs:
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.check_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run deterministic verification
        run: make check

      - name: Tracked and untracked non-ignored tree must be unchanged
        if: ${{ always() }}
        run: |
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/worktree-status"
          if test -s "$RUNNER_TEMP/worktree-status"; then
            echo "Required verification modified tracked or untracked non-ignored files:"
            cat "$RUNNER_TEMP/worktree-status"
            exit 1
          fi

  verify_tests:
    name: verify tests (${{ matrix.python-version }}, ${{ matrix.shard }})
    if: ${{ needs.plan.outputs.run_tests == 'true' }}
    needs:
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run required unit tests
        env:
          TEST_FILES: ${{ matrix.test-files }}
          # A/B experiment: fixtures on tmpfs. Local profiling attributes most
          # writer-tool time to the durable-write ceremony (fsync of receipts,
          # locks and state rewrites); on tmpfs that cost collapses. This run
          # measures how much of that finding transfers to Linux runners.
          TMPDIR: /dev/shm
        run: make test-selected PYTHON=python TEST_FILES="$TEST_FILES"

      - name: Tracked and untracked non-ignored tree must be unchanged
        if: ${{ always() }}
        run: |
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/worktree-status"
          if test -s "$RUNNER_TEMP/worktree-status"; then
            echo "Required verification modified tracked or untracked non-ignored files:"
            cat "$RUNNER_TEMP/worktree-status"
            exit 1
          fi

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs:
      - plan
      - verify_check
      - verify_tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix job to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECK_RESULT: ${{ needs.verify_check.result }}
          TEST_RESULT: ${{ needs.verify_tests.result }}
          RUN_TESTS: ${{ needs.plan.outputs.run_tests }}
          VERIFICATION_MODE: ${{ needs.plan.outputs.mode }}
        run: |
          if test "$PLAN_RESULT" != "success"; then
            echo "impact plan result: $PLAN_RESULT"
            exit 1
          fi
          if test "$CHECK_RESULT" != "success"; then
            echo "verify check matrix result: $CHECK_RESULT"
            exit 1
          fi
          if test "$RUN_TESTS" = "true" && test "$TEST_RESULT" != "success"; then
            echo "verify test matrix result: $TEST_RESULT"
            exit 1
          fi
          if test "$RUN_TESTS" != "true" && test "$TEST_RESULT" != "skipped"; then
            echo "checks-only plan expected skipped tests, got: $TEST_RESULT"
            exit 1
          fi
          echo "verification mode: $VERIFICATION_MODE"
          echo "verify check matrix result: success"
          echo "verify test matrix result: $TEST_RESULT"
