name: verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  plan:
    name: plan affected verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      run_tests: ${{ steps.plan.outputs.run_tests }}
      check_matrix: ${{ steps.plan.outputs.check_matrix }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up planning Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Require a canonical open Issue owner
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python .github/scripts/issue_owner.py \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY"

      - name: Compute fail-closed impact plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python .github/scripts/ci_impact.py plan \
            --root . \
            --event "${{ github.event_name }}" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --plan-path "$RUNNER_TEMP/ci-plan.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish selection rationale
        run: |
          echo '## CI impact plan' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/ci-plan.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Planning must leave the tree unchanged
        if: ${{ always() }}
        run: |
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/worktree-status"
          if test -s "$RUNNER_TEMP/worktree-status"; then
            echo "CI planning modified tracked or untracked non-ignored files:"
            cat "$RUNNER_TEMP/worktree-status"
            exit 1
          fi

  verify_check:
    name: verify check (${{ matrix.python-version }})
    needs:
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.check_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the pinned Profile toolchain
        run: |
          python -m pip install --disable-pip-version-check -r Tools/requirements-profile.txt
          python .github/scripts/install_cue.py --destination "$RUNNER_TEMP/cambium-profile-cue"
          echo "CAMBIUM_CUE=$RUNNER_TEMP/cambium-profile-cue/cue" >> "$GITHUB_ENV"

      - name: Run deterministic verification
        run: make check

      - name: Tracked and untracked non-ignored tree must be unchanged
        if: ${{ always() }}
        run: |
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/worktree-status"
          if test -s "$RUNNER_TEMP/worktree-status"; then
            echo "Required verification modified tracked or untracked non-ignored files:"
            cat "$RUNNER_TEMP/worktree-status"
            exit 1
          fi

  verify_tests:
    name: verify tests (${{ matrix.python-version }}, ${{ matrix.shard }})
    if: ${{ needs.plan.outputs.run_tests == 'true' }}
    needs:
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the pinned Profile toolchain
        run: |
          python -m pip install --disable-pip-version-check -r Tools/requirements-profile.txt
          python .github/scripts/install_cue.py --destination "$RUNNER_TEMP/cambium-profile-cue"
          echo "CAMBIUM_CUE=$RUNNER_TEMP/cambium-profile-cue/cue" >> "$GITHUB_ENV"

      - name: Set up rendering Node
        if: ${{ contains(format(',{0},', matrix.test-files), ',test_deterministic_rendering_contract.py,') }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Bind the pinned static-rendering Host
        if: ${{ contains(format(',{0},', matrix.test-files), ',test_deterministic_rendering_contract.py,') }}
        run: |
          renderer_workspace="$RUNNER_TEMP/cambium-static-renderer"
          mkdir -p "$renderer_workspace"
          cp Tools/knowledge/rendering/static_renderer/package.json Tools/knowledge/rendering/static_renderer/package-lock.json "$renderer_workspace/"
          npm ci --prefix "$renderer_workspace" --ignore-scripts --no-audit --no-fund
          export PLAYWRIGHT_BROWSERS_PATH="$renderer_workspace/browsers"
          node "$renderer_workspace/node_modules/playwright-core/cli.js" install --with-deps chromium
          renderer_node="$(node -p 'process.execPath')"
          renderer_browser="$(node -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$renderer_workspace/node_modules/playwright-core")"
          test -x "$renderer_node"
          test -x "$renderer_browser"
          printf 'CAMBIUM_RENDER_NODE=%s\n' "$renderer_node" >> "$GITHUB_ENV"
          printf 'CAMBIUM_RENDER_BROWSER=%s\n' "$renderer_browser" >> "$GITHUB_ENV"
          printf 'CAMBIUM_RENDER_NODE_MODULES=%s\n' "$renderer_workspace/node_modules" >> "$GITHUB_ENV"

      - name: Run catalog-selected tests
        env:
          TEST_FILES: ${{ matrix.test-files }}
        run: make test-selected PYTHON=python TEST_FILES="$TEST_FILES"

      - name: Tracked and untracked non-ignored tree must be unchanged
        if: ${{ always() }}
        run: |
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/worktree-status"
          if test -s "$RUNNER_TEMP/worktree-status"; then
            echo "Required verification modified tracked or untracked non-ignored files:"
            cat "$RUNNER_TEMP/worktree-status"
            exit 1
          fi

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs:
      - plan
      - verify_check
      - verify_tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix job to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECK_RESULT: ${{ needs.verify_check.result }}
          TEST_RESULT: ${{ needs.verify_tests.result }}
          RUN_TESTS: ${{ needs.plan.outputs.run_tests }}
          VERIFICATION_MODE: ${{ needs.plan.outputs.mode }}
        run: |
          if test "$PLAN_RESULT" != "success"; then
            echo "impact plan result: $PLAN_RESULT"
            exit 1
          fi
          if test "$CHECK_RESULT" != "success"; then
            echo "verify check matrix result: $CHECK_RESULT"
            exit 1
          fi
          if test "$RUN_TESTS" = "true" && test "$TEST_RESULT" != "success"; then
            echo "verify test matrix result: $TEST_RESULT"
            exit 1
          fi
          if test "$RUN_TESTS" != "true" && test "$TEST_RESULT" != "skipped"; then
            echo "checks-only plan expected skipped tests, got: $TEST_RESULT"
            exit 1
          fi
          echo "verification mode: $VERIFICATION_MODE"
          echo "verify check matrix result: success"
          echo "verify test matrix result: $TEST_RESULT"
