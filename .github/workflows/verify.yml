name: verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify_check:
    name: verify check (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Exercise deterministic checks at both ends of the supported range,
        # once per interpreter rather than once per unit-test shard.
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run deterministic verification
        run: make check

      - name: Tracked and untracked non-ignored tree must be unchanged
        if: ${{ always() }}
        run: |
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/worktree-status"
          if test -s "$RUNNER_TEMP/worktree-status"; then
            echo "Required verification modified tracked or untracked non-ignored files:"
            cat "$RUNNER_TEMP/worktree-status"
            exit 1
          fi

  verify_tests:
    name: verify tests (${{ matrix.python-version }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Exercise both ends of the supported interpreter range.
        python-version: ["3.10", "3.14"]
        # Keep complete coverage while bounding the slowest job.  The Makefile
        # checks that these four disjoint patterns cover every test file once.
        shard: ["a-b", "c-m", "n-r", "s-z"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run required unit tests
        run: make "test-${{ matrix.shard }}"

      - name: Tracked and untracked non-ignored tree must be unchanged
        if: ${{ always() }}
        run: |
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/worktree-status"
          if test -s "$RUNNER_TEMP/worktree-status"; then
            echo "Required verification modified tracked or untracked non-ignored files:"
            cat "$RUNNER_TEMP/worktree-status"
            exit 1
          fi

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs:
      - verify_check
      - verify_tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix job to succeed
        env:
          CHECK_RESULT: ${{ needs.verify_check.result }}
          TEST_RESULT: ${{ needs.verify_tests.result }}
        run: |
          if test "$CHECK_RESULT" != "success"; then
            echo "verify check matrix result: $CHECK_RESULT"
            exit 1
          fi
          if test "$TEST_RESULT" != "success"; then
            echo "verify test matrix result: $TEST_RESULT"
            exit 1
          fi
          echo "verify check matrix result: success"
          echo "verify test matrix result: success"
