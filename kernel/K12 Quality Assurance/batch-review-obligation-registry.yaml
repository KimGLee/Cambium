schema_version: 1
registry_id: cambium-batch-review-obligations
semantic_owner: K12/01-K12/14
machine_projection_owner: K12/14

# This is the sole machine projection of the Kernel-owned M-tier checklist and
# S-tier sampling rule. The seven M-tier bullets remain human-readable source
# groups; only the atomic items below are AuditPlan obligation members.
closed_world:
  m_tier_atomic_items: true
  source_groups_are_obligations: false
  profile_extensions_in_base_set: false
  unknown_item_fields: reject

# The plan freezes every registered atom as a definition.  A conditional atom
# is discharged by an explicit page-review disposition, never by disappearing
# from the plan or by silently being treated as universally applicable.
m_applicability_contract:
  unconditional_predicate: always
  disposition_values:
    - applicable
    - not-applicable
  applicable_reason: null
  not_applicable_reason: nonempty
  plan_definition_policy: freeze-all-registered-atoms

audit_plan_projection:
  owner_kind: kernel
  kernel_extension_point: null
  target_source: manifest-page
  acceptance_predicate_source: acceptance_contract.contract_id
  evidence_kind: batch-page-review-record
  consumer_gate_id: batch-review
  due_stage: pre-merge
  fingerprint_binding: evidence-time
  trigger_partition_mappings:
    - trigger: new
      partition: initial-semantic-review
    - trigger: needs_rereview
      partition: invalidated-semantic-review
  trigger_meanings:
    new: The page has no accepted semantic review for its current governed identity.
    needs_rereview: The page's accepted semantic evidence was invalidated by a governed change.

# These rows machine-resolve the existing K12/08 `consumes` arrows.  The two
# M05 atoms consume the exact same-page pre-merge wiki-link Gate obligation;
# M07 consumes the complete same-page changed-scope deterministic closure.
# The conditional Profile-rendering atom remains HOLD until its typed Profile
# contract registers an exact producer.  That HOLD is not completion evidence
# and does not block a page on which the rendering condition is not applicable.
m_consumption_contracts:
  - item_id: m05-no-required-link-missing
    resolution: resolved
    selector:
      selector_id: m05-wiki-link-resolution-v1
      source: audit-plan-obligation-evidence
      owner_kind: kernel
      owner_rule_ids:
        - k12-02-level0-wiki-link-resolution
      kernel_extension_point: null
      partition: changed-scope-deterministic
      due_stage: pre-merge
      target_binding: same-page
      evidence_role: emits
      obligation_status: required
      consumer_gate_id: batch-review
      evidence_currency: current
      evidence_result_values:
        - pass
        - passed
      match_cardinality: exactly-one
    hold_reason: null
  - item_id: m05-no-required-link-ambiguous
    resolution: resolved
    selector:
      selector_id: m05-wiki-link-resolution-v1
      source: audit-plan-obligation-evidence
      owner_kind: kernel
      owner_rule_ids:
        - k12-02-level0-wiki-link-resolution
      kernel_extension_point: null
      partition: changed-scope-deterministic
      due_stage: pre-merge
      target_binding: same-page
      evidence_role: emits
      obligation_status: required
      consumer_gate_id: batch-review
      evidence_currency: current
      evidence_result_values:
        - pass
        - passed
      match_cardinality: exactly-one
    hold_reason: null
  - item_id: m06-triggered-rendering-obligations-applied
    resolution: hold
    selector: null
    hold_reason: The existing Profile extension point does not register a unique rendering-obligation evidence selector for this M item.
  - item_id: m07-applicable-deterministic-checks-pass
    resolution: resolved
    selector:
      selector_id: m07-same-page-pre-merge-changed-scope-emits-v1
      source: audit-plan-obligation-evidence
      owner_kind: kernel
      owner_rule_ids: null
      kernel_extension_point: null
      partition: changed-scope-deterministic
      due_stage: pre-merge
      target_binding: same-page
      evidence_role: emits
      obligation_status: required
      consumer_gate_id: batch-review
      evidence_currency: current
      evidence_result_values:
        - pass
        - passed
      match_cardinality: one-or-more-all-matching-required
    hold_reason: null

m_tier_source_groups:
  - group_id: m01-metadata-and-status
    display_order: 1
    source_text: "The note type, canonical owner, scope, depth, priority, tier, and applicable status fields are explicit and internally consistent."
  - group_id: m02-opening-mechanism-boundary-example
    display_order: 2
    source_text: "The opening states the problem or position; the body explains the key mechanism or causal chain, its important boundary, and at least one example appropriate to the note type."
  - group_id: m03-failure-behavior
    display_order: 3
    source_text: "Applicable failure behavior is concrete enough to identify trigger, symptom, cause, detection, and mitigation; an item that is genuinely not applicable is stated as such rather than silently omitted."
  - group_id: m04-evidence-and-claim-role
    display_order: 4
    source_text: "Key, time-sensitive, or quantitative claims are supported by evidence whose role is clear; reported claim, inference, synthesis, and recommendation are not conflated."
  - group_id: m05-body-links
    display_order: 5
    source_text: "Parent, prerequisite, key dependency, and first meaningful terminology links are present in the body; no missing or ambiguous link remains."
  - group_id: m06-profile-obligations
    display_order: 6
    source_text: "The selected profile's `Language Contract` and all triggered source, terminology, propagation, and rendering obligations have been applied."
  - group_id: m07-deterministic-and-rendering
    display_order: 7
    source_text: "Applicable deterministic checks pass. Rendering remains at Level 0 / Level 1 unless an objective visual exception trigger and unresolved question are recorded."

