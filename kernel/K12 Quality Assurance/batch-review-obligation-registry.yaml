s_tier_sampling:
  rule_id: k12-14-s-tier-bounded-sampling
  population:
    target_source: current-batch-manifest-pages
    tier: S
    variable: n
  sample_count:
    when_n_less_than_minimum: all
    minimum_count: 2
    percentage_numerator: 20
    percentage_denominator: 100
    rounding: ceiling
    otherwise: max(2, ceil(n * 20 / 100))
    integer_equivalent: max(2, (n * 20 + 99) // 100)
  selection_execution:
    authority: tool
    kernel_meaning: none
    requirements:
      - The same frozen population and Tool algorithm identity produce the same selected target set.
      - The Tool freezes the population, required count, selected target set, and selection fingerprint before review begins.
      - The Tool does not treat its selection algorithm as a Kernel judgment rule.
  sampled_review_obligation:
    applicability: selected-by-frozen-tool-sample
    acceptance_contract:
      contract_id: k12-14-s-tier-sampled-review-v1
      text: S-tier pages are reviewed by sampling; when sampling finds problems, expand the scope per K12/07.
    evidence_role: emits
    evidence_kind: batch-page-review-record
    dimension: null
    producer_capability: batch-page-review-attestation-v1
    producer_check: batch_page_review:s-tier-sampled-review
    consumer_gate_id: batch-review
    due_stage: pre-merge
    partition: bounded-sampling
    fingerprint_binding: evidence-time

