      type: string
    - field: producer_capability
      type: string
    - field: consumer_gate_id
      type: string
    - field: fingerprint_binding
      type: string
    - field: artifact_fingerprint
      type: sha256
    - field: dependency_fingerprint
      type: sha256
    - field: contract_fingerprint
      type: sha256
    - field: semantic_content_fingerprint
      type: sha256
    - field: reviewer_context_id
      type: string
    - field: reviewer_role
      type: string
    - field: verdict
      type: string
    - field: consumed_evidence_refs
      type: string-list
    - field: sample_rule_id
      type: string
    - field: sample_population_count
      type: integer
    - field: sample_population_targets
      type: string-list
    - field: sample_population_sha256
      type: sha256
    - field: sample_required_count
      type: integer
    - field: sample_selected_targets
      type: string-list
    - field: sample_selected_set_sha256
      type: sha256
    - field: selection_algorithm_id
      type: string
    - field: selection_fingerprint
      type: sha256
    - field: selection_frozen_at
      type: utc-timestamp
  required_common_fields:
    - schema_version
    - record_kind
    - receipt_id
    - review_variant
    - tool
    - tool_version
    - check
    - target
    - result
    - details
    - checked_at
    - invalidated_by
    - plan_id
    - audit_plan_sha256
    - obligation_id
    - task_id
    - batch_id
    - opening_transition_receipt
    - standards_version
    - active_standards_sha256
    - selected_profile_manifest
    - profile_snapshot_sha256
    - profile_contract_fingerprint
    - tier
    - partition
    - due_stage
    - evidence_role
    - evidence_kind
    - dimension
    - acceptance_predicate
    - producer_capability
    - consumer_gate_id
    - fingerprint_binding
    - artifact_fingerprint
    - dependency_fingerprint
    - contract_fingerprint
    - semantic_content_fingerprint
    - reviewer_context_id
    - reviewer_role
    - verdict
    - consumed_evidence_refs
  variants:
    - review_variant: m-atomic-item
      tier: M
      required_fields:
        - applicability_disposition
        - applicability_reason
        - item_id
        - rule_id
        - source_group
      forbidden_fields:
        - sample_rule_id
        - sample_population_count
        - sample_population_targets
        - sample_population_sha256
        - sample_required_count
        - sample_selected_targets
        - sample_selected_set_sha256
        - selection_algorithm_id
        - selection_fingerprint
        - selection_frozen_at
      invariants:
        - item_id, rule_id, source_group, check, evidence_role, dimension, acceptance_predicate, producer_capability, consumer_gate_id, due_stage, and partition equal the named registry item and its resolved trigger partition.
        - dimension is exactly one registered receipt dimension.
        - An always-applicable item records applicable with a null reason; a conditional item records applicable with a null reason or not-applicable with a nonempty reason.
        - An emits item has an empty consumed_evidence_refs list. An applicable consumes item binds exactly the canonical evidence selected by its resolved consumption contract; an unresolved selector is HOLD. A not-applicable conditional consumes item binds no evidence.
    - review_variant: s-sampled-page
      tier: S
      required_fields:
        - sample_rule_id
        - sample_population_count
        - sample_population_targets
        - sample_population_sha256
        - sample_required_count
        - sample_selected_targets
        - sample_selected_set_sha256
        - selection_algorithm_id
        - selection_fingerprint
        - selection_frozen_at
      forbidden_fields:
        - applicability_disposition
        - applicability_reason
        - item_id
        - rule_id
        - source_group
      invariants:
        - dimension is null; this record is not disguised as a dimension-specific AuditReceipt.
        - sample_rule_id, sample_required_count, check, evidence_role, acceptance_predicate, producer_capability, consumer_gate_id, due_stage, and partition equal the S-tier sampling registry entry.
        - sample_population_targets and sample_selected_targets are sorted and unique; the selected set contains target, is a subset of the frozen population, and has sample_required_count members.
        - sample_population_sha256, sample_selected_set_sha256, and selection_fingerprint bind the exact frozen population, selected set, and Tool algorithm identity.
  result_values:
    - pass
    - fail
  verdict_result_mappings:
    - verdict: passed
      result: pass
    - verdict: changes-required
      result: fail
