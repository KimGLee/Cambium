    values:
      - required
      - optional
      - deferred
      - excluded
  evidence_maturity:
    owner: "kernel/K08 Metadata and Status/04 Evidence and Relationship Metadata.md#Evidence Maturity"
    values:
      - signal
      - single-source
      - corroborated
      - validated
      - contested
      - superseded
