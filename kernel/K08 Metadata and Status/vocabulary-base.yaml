  scope:
    owner: "kernel/K08 Metadata and Status/02 Scope Level Depth and Priority.md#Scope"
    values:
      - shared
      - domain-specific
      - case-specific
      - source-specific
  level:
    owner: "kernel/K08 Metadata and Status/02 Scope Level Depth and Priority.md#Level"
    values:
      - basic
      - intermediate
      - advanced
  depth:
    owner: "kernel/K08 Metadata and Status/02 Scope Level Depth and Priority.md#Depth"
