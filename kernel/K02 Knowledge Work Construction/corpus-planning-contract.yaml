schema_version: 2
contract_id: cambium-corpus-planning-contract
semantic_owner: K02/03+K02/04+K02/05+K02/06+K02/07

# K02/03 owns the Profile-slot envelope and its two applicability branches.
# This document carries only the closed machine shape already defined there;
# adopter values remain owned by the selected Profile.
slot_envelope:
  slot_name: Corpus Planning
  schema_version: 1
  fields:
    - schema_version
    - applicability
    - artifact_bindings
    - capability_scale
    - pass_authority
  applicability_fields:
    - state
    - reason
  artifact_binding_fields:
    - global_map
    - capability_matrix
    - gap_register
  capability_scale_fields:
    - rank
    - value
    - predicate
    - target_eligible
  pass_authority_fields:
    - role_id
    - decision_scope_id
  applicability_branches:
    configured: configured
    inactive: not-applicable
  artifact_roles:
    global_map: Global Map
    capability_matrix: Capability Matrix
    gap_register: Gap Register
  semantic_acceptance_scope: corpus-plan-semantic-acceptance

# K02/04 owns the freshness binding shared by structural and semantic pass
# receipts. The requirement column says only which existing applicability
# branch makes a path/SHA pair non-null.
receipt_binding:
  fields:
    - task_id
    - queue_revision
    - queue_state_revision
    - selected_profile_manifest
    - selected_profile_manifest_sha256
    - profile_snapshot_sha256
    - profile_contract_fingerprint
    - profile_load_inputs_sha256
    - corpus_planning_slot_path
    - corpus_planning_slot_sha256
    - profile_scope_path
    - profile_scope_sha256
    - global_map_path
    - global_map_sha256
    - capability_matrix_path
    - capability_matrix_sha256
    - gap_register_path
    - gap_register_sha256
    - corpus_plan_applicability
    - coverage_ledger_sha256
    - required_queue_sha256
    - progress_ledger_sha256
    - repository_snapshot_sha256
  path_sha_bindings:
    - path_field: selected_profile_manifest
      sha256_field: selected_profile_manifest_sha256
      requirement: always
    - path_field: corpus_planning_slot_path
      sha256_field: corpus_planning_slot_sha256
      requirement: always
    - path_field: profile_scope_path
      sha256_field: profile_scope_sha256
      requirement: configured
    - path_field: global_map_path
      sha256_field: global_map_sha256
      requirement: configured
    - path_field: capability_matrix_path
      sha256_field: capability_matrix_sha256
      requirement: configured
    - path_field: gap_register_path
      sha256_field: gap_register_sha256
      requirement: configured

# K02/04 defines the two existing reasons a batch-close child becomes
# applicable. These are identifiers only; route and manifest state remain
# owned by Progress and Queue respectively.
close_triggers:
  selected_route: R13
  affected_manifest: manifest

# K02/05, K02/06, and K02/07 already define these three registered machine
# contracts as the sole normative source for field closure, cardinality, and
# closed vocabularies.  Keeping the registrations in this one Kernel-owned
# document prevents the checker and the candidate templates from becoming
# additional owners.
artifact_contracts:
  global_map:
    contract_id: global-map
    semantic_owner: K02/05
    document_schema_version: 1
    document_fields:
      - schema_version
      - entries
      - typed_dependencies
    collections:
      entries:
        record_fields:
          - entry_id
          - layer_id
          - canonical_markdown_path
          - single_responsibility
        minimum_items: 1
        unique_fields:
          - entry_id
          - canonical_markdown_path
        nonempty_list_fields: []
      typed_dependencies:
        record_fields:
          - edge_id
          - upstream_entry_id
          - downstream_entry_id
          - relation_type
        minimum_items: 0
        unique_fields:
          - edge_id
        nonempty_list_fields: []
    relation_types:
      - prerequisite-for
      - capability-input-to
      - realized-by
      - evidence-input-to
      - system-input-to
      - control-input-to
      - canonical-source-for
      - expressed-by
      - downstream-impact
  capability_matrix:
    contract_id: capability-matrix
    semantic_owner: K02/06
    document_schema_version: 1
    document_fields:
      - schema_version
      - capabilities
    collection:
      name: capabilities
      record_fields:
        - capability_id
        - capability
        - priority
        - map_entry_ids
        - canonical_markdown_paths
        - current_level
        - target_level
        - evidence_paths
        - gap_ids
      minimum_items: 1
      unique_fields:
        - capability_id
      nonempty_list_fields:
        - map_entry_ids
        - canonical_markdown_paths
      list_fields:
        - map_entry_ids
        - canonical_markdown_paths
        - evidence_paths
        - gap_ids
    priority_values_owner: K08-vocabulary.priority
    scale_owner: selected-profile.Corpus-Planning.capability_scale
    conditional_rules:
      target_requires_eligible_scale_row: true
      rank_above_zero_requires_evidence: true
      below_target_requires_gap: true
      matrix_gap_links_bidirectional: true
  gap_register:
    contract_id: gap-register
    semantic_owner: K02/07
    document_schema_version: 1
    document_fields:
      - schema_version
      - gaps
    collection:
      name: gaps
      record_fields:
        - gap_id
        - gap_statement
        - capability_ids
        - candidate_owner_entry_id
        - status
        - close_condition
        - evidence_paths
        - promoted_coverage_path
        - rationale
      minimum_items: 0
      unique_fields:
        - gap_id
      nonempty_list_fields:
        - capability_ids
      list_fields:
        - capability_ids
        - evidence_paths
    statuses:
      - candidate
      - confirmed
      - promoted
      - resolved
      - deferred
      - rejected
    promoted_statuses:
      - promoted
      - resolved
    unpromoted_statuses:
      - candidate
      - confirmed
      - deferred
      - rejected
    resolved_status: resolved
    conditional_rules:
      promoted_requires_coverage_path: true
      unpromoted_forbids_coverage_path: true
      resolved_requires_evidence: true
      matrix_gap_links_bidirectional: true
