# Cambium kernel execution-default override registry.
# Canonical membership of the execution defaults a selected profile may
# override, and of the constants it may not. Registered by
# "kernel/K00 Standards Control/09 Default Constraints Snapshot.md".
#
# This registry owns membership only. Each entry's `owner` is the sole source
# for that item's meaning, kernel default value, unit, and range; this file
# never restates them. `value_domain` is present only where the owner module
# already fixes the admissible form of an overriding value, and it names that
# form. A form MAY carry the bound its owner writes into it, because a bound
# the owner states as part of what a well-formed value is cannot be checked by
# naming the form alone; the name still points at the owner and never repeats
# the owner's default value.

schema_version: 1

# Items a profile may explicitly override in its `Execution Default Overrides`
# manifest table. Anything absent from that table uses its kernel default.
# `item` is the exact string a manifest row must use.
overridable:
  - item: "concurrency_cap"
    owner: "kernel/K13 Task Runtime and Execution Control/10 Batch Admission Transitions and Serial Integration.md"
    value_domain: "positive-integer"
  - item: "batch_size.S"
    owner: "kernel/K02 Knowledge Work Construction/09 Knowledge Batch Production.md"
  - item: "batch_size.M"
    owner: "kernel/K02 Knowledge Work Construction/09 Knowledge Batch Production.md"
  - item: "batch_size.L"
    owner: "kernel/K02 Knowledge Work Construction/09 Knowledge Batch Production.md"
  - item: "maintenance.unselected_rounds_before_log_only"
    owner: "kernel/K00 Standards Control/08 Maintenance Run Envelope.md"
  - item: "maintenance.incoming_retarget_divisor"
    owner: "kernel/K00 Standards Control/08 Maintenance Run Envelope.md"

# Constitutional constants. A profile that registers one of these in its
# `Execution Default Overrides` table is registering something it cannot
# override.
constitutional:
  - item: "substantive_review.round_cap"
    owner: "kernel/K12 Quality Assurance/12 Substantive Correctness Review.md"
  - item: "terminal_audit.round_cap"
    owner: "kernel/K12 Quality Assurance/15 Terminal Audit and Convergence.md"
