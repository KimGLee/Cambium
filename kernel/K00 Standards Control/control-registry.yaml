      - not-batch-scoped
    revalidation_role: special-owner
    revalidation_owner: profile-load
    claim_edge: after-image-admission
    scope_protocol: profile-after-image
    binding_protocol: profile-fingerprints
  - gate_id: runtime-startup-recovery
