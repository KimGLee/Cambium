schema_version: 1
registry_id: cambium-control-registry
semantic_owner: K00/12

# This file is the sole machine authority for current Gate receipt selectors,
# producer availability, and Standards-revalidation projection. K00/12 prose
# explains the risk and authority meaning without repeating these rows.
registry_references:
  audit_dimension_base: kernel/K12 Quality Assurance/audit-dimension-base.yaml

closed_sets:
  dimension_markers:
    unnarrowed: "*"
    undimensioned: none
  producer_availability_markers:
    unscoped: not-batch-scoped
    queue_exhausted: queue-exhausted
  revalidation_roles:
    - special-owner
    - immediate-owner
    - native-owner
    - semantic-leaf
    - mechanism-only
    - unsupported
    - advisory
  claim_edges:
    - after-image-admission
    - adoption-commit
    - native-transition
    - project-to-owner
    - mechanism-input-only
    - advisory-only
    - none
  scope_protocols:
    - profile-after-image
    - runtime-after-image
    - native-owner-scope
    - inherit-owner-scope
    - diagnostic-scope
    - none
  binding_protocols:
    - profile-fingerprints
    - runtime-state-fingerprints
    - native-owner-receipt
    - owner-member-chain
    - not-authorizing

role_contracts:
  - role: special-owner
    claim_edge: after-image-admission
    scope_protocol: profile-after-image
    binding_protocol: profile-fingerprints
  - role: immediate-owner
    claim_edge: adoption-commit
    scope_protocol: runtime-after-image
    binding_protocol: runtime-state-fingerprints
  - role: native-owner
    claim_edge: native-transition
    scope_protocol: native-owner-scope
    binding_protocol: native-owner-receipt
  - role: semantic-leaf
    claim_edge: project-to-owner
    scope_protocol: inherit-owner-scope
    binding_protocol: owner-member-chain
  - role: mechanism-only
    claim_edge: mechanism-input-only
    scope_protocol: none
    binding_protocol: not-authorizing
  - role: unsupported
    claim_edge: none
    scope_protocol: none
    binding_protocol: not-authorizing
  - role: advisory
    claim_edge: advisory-only
    scope_protocol: diagnostic-scope
    binding_protocol: not-authorizing

gates:
