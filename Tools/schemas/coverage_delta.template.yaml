# =============================================================================
# Coverage Delta template (state increment of a concurrent batch; the template is the schema doc)
# Owner standard: "kernel/K13 Task Runtime and Execution Control/10 Batch Admission Transitions and Serial Integration.md"
#            (Concurrent Batches: concurrent batches never write the
#             Coverage/Progress Ledger directly; they only produce this file,
#             and the integrator applies it to the canonical Ledger during
#             the serial merge)
# Location: .cambium/deltas/<batch>.yaml; after merging, the integrator
#             applies it and retains it with the merge receipt as the durable
#             delta referenced by the closed Queue history
#
# Only the restricted YAML subset is allowed (parseable by Tools/kblib.py parse_yaml_subset):
#   - `key: value` scalars; `- item` lists indented under `key:`; list items
#     may be a one-level flat map.
# =============================================================================

batch: "B7"                        # the batch that produced this delta (same name as its receipts directory)
generated_at: "2026-07-30T12:00:00+08:00"  # time the delta was written out (when the batch became merge-ready)

pages:                             # status updates for pages on this batch's manifest (manifest pages only; out-of-manifest pages are rejected at merge)
  - path: "Topics/Example Topic.md"
    authoring_status: reviewed     # updated status-axis value (vocabulary owner K08/03)
    gate_receipts: ["r-0311", "r-0312"]  # receipt ids this batch produced for the page

# A page delta MUST NOT contain any control field owned by Coverage
# reconciliation, profile policy, or Queue compilation.  If even one page
# contains one of these keys, apply_delta rejects the entire delta and writes
# nothing (the value is forbidden even when it matches the current value):
#   coverage_disposition, canonical_owner, batch, next_batch, priority, tier,
#   type, prerequisites, deferred_reason, reentry_condition
# Workers may report a proposed route change only through
# `next_batch_updates`; that list is suggestion-only and is never applied by
# apply_delta.  The integrator resolves it through the controlled
# Coverage/Queue replan path.
#
# Every open gap whose current `next_batch` is this batch is a close
# obligation. Before `open -> merge-ready`, run `apply_delta.py --preflight`:
# the prospective after-image must close every such gap and may add a gap only
# when its target is an existing actionable later batch. The transition freezes
# that exact settlement with the Delta. A reroute of an existing gap is not a
# worker edit and must complete through the controlled Amendment path before
# freeze; close only re-proves the binding and never rewrites a frozen Delta.

open_gaps_added: []                # open gaps added by this batch (including needs_rereview and cross-batch missing links, type: link; type vocabulary in the coverage_ledger template)
open_gaps_closed: []               # existing gaps routed to this batch and closed here (gap id or page+type)
next_batch_updates: []             # suggestion-only; apply_delta never writes these values into Coverage
watermark_advance:                 # optional: watermark advance values from source/maintenance batches (K13/10; the integrator applies them to Tools/state/watermark.yaml at merge)
