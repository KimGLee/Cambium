# =============================================================================
# Cross-Ledger Amendment transaction plan
# Owner standard: kernel/K13 Task Runtime and Execution Control/06 Amendment Log and Controlled Replanning.md
# Implemented by: Tools/execution/task_runtime/apply_amendment.py
# Location: .cambium/deltas/amendments/<amendment-id>.yaml
#
# The plan binds one approved decision to one complete proposed Coverage
# document and the exact Queue revision edges that must accompany it.
# `register_amendment.py` first fixes the plan path/SHA and current three-state
# fingerprints in Progress plus a registration receipt. `apply_amendment.py`
# then consumes that exact registered authorization. The plan is a transaction
# input, not canonical runtime state.
#
# Decision authority is not copied into this plan. At registration the writer
# derives a closed impact from these bytes and current state, then either binds
# the Task Contract's amendment_authority or requires an explicit user approval
# reference. Every downstream writer re-derives that same impact under lock.
# =============================================================================

schema_version: 1
amendment_id: "A-SCOPE-001"
operation: scope-replan               # scope-replan | cancel-batch
affected_pages:
  - "Topics/New Required Topic.md"
affected_batches:
  - "B3"
scope_version_before: "s1"
scope_version_after: "s2"
queue_revision_before: 4
queue_revision_after: 5
state_revision_before: 9
state_revision_after: 9
coverage_proposal_path: ".cambium/deltas/amendments/A-SCOPE-001.coverage.yaml"
coverage_proposal_sha256: "sha256:replace-with-proposal-fingerprint"
cancel_batch_id: null                 # required batch id for cancel-batch
