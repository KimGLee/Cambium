# =============================================================================
# Coverage Ledger template (machine-readable state layer; the template is the schema doc)
# Owner standard: "02 Build Execution/03 Inventory and Coverage Reconciliation.md"
#            (the Coverage Ledger is the authoritative record of page-level
#             coverage; the Progress Ledger records task and batch progress only)
# Vocabulary source: the 08 Metadata and Status domain (see Tools/vocab.yaml,
#             a compiled artifact)
#
# Only the restricted YAML subset is allowed (parseable by Tools/kblib.py parse_yaml_subset):
#   - `key: value` scalars (string/number/boolean/null, quoted strings, inline `[]`);
#   - `- item` lists indented under `key:`;
#   - list items may be a one-level flat map; two-level indented nested maps.
#   Not allowed: anchors/aliases, block scalars (| >), flow maps {}, tags, multi-document.
# =============================================================================

task_id: "kb-build-2026-xx"        # task identifier; must match the Progress Ledger's task_id (02/05)
updated_at: "2026-07-21T00:00:00Z" # time of the most recent reconciliation/update of this Ledger (02/03 Coverage Reconciliation point)
scope_version: "s1"                # scope version when this Ledger was generated (contract field frozen in 02/01 Phase 0)

pages:                             # exactly one record per in-scope .md file; Required knowledge objects not yet created also get a record (02/03)
  - path: "Topics/Example Topic.md"  # full vault-relative path (09/03: no fuzzy numbering)
    type: concept                  # note type; vocabulary owner: 08 Metadata and Status/01 (Type Vocabulary)
    priority: P0                   # P0/P1/P2; vocabulary owner: 08 Metadata and Status/02 (Priority)
    tier: M                        # page size tier S/M/L (execution helper field of this Ledger, not an 08-domain vocabulary; used for batch scheduling estimates)
    authoring_status: drafted      # unassessed/outline/drafted/reviewed; owner: 08/03 Status Axes (legacy pages without metadata default to unassessed, 02/03)
    interview_status: missing      # not-required/missing/mapped/drafted/reviewed/interview-ready; owner: 08/03 Status Axes
    # optional: volatility: fast   # fast/slow/stable shelf-life tier; tier definitions and domain dispatch owner: 08/05 (vocabulary registered in 08/01)
    # optional: review_by: "2026-11-18"  # re-verification due date; generated by Tools/check_freshness.py (script-generated, read-only, never hand-filled)
    # optional: lifecycle: active  # active/retired/merged; process owner: 03/03 (retired/merged pages leave the Required set)
    batch: "B3"                    # batch this page belongs to / is planned for; unfinished Required items must have an explicit next batch (02/03)
    gate_receipts:                 # latest valid receipt IDs for this page (the Coverage Ledger records only IDs and invalidation state, never full receipt copies, 12/07)
      - "audit-check_links-20260721T000000Z-0001"
      - "audit-check_vocab-20260721T000000Z-0002"

open_gaps:                         # list of unclosed gaps; the Terminal Proof's required_authoring_gaps must reconcile against this (12/06)
  - page: "Topics/Example Topic.md"  # page containing the gap (or the name of a Required object not yet created)
    type: missing-section          # gap type: missing-page/missing-section/missing-source/missing-interview-card/rereview etc. (02/03 inventory dimensions; rereview = downstream needs_rereview flagged by an upstream mechanism-level change, owner: 12/07 Content-level Propagation)
    note: "Missing the Failure Modes section"  # explanation of what is missing and why it remains open

next_batch_candidates:             # candidate page paths for the next batch; confirmed via Required Queue ordering before entering a batch (02/05)
  - "Topics/Example Dependency.md"
