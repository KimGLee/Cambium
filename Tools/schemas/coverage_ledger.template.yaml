# Explicit compiler input. Each entry has exactly the seven fields shown below;
# missing or additional scheduler fields fail closed. These are proposed batch
# structures, not lifecycle state: Required Queue becomes authoritative only
# after the integrator applies
# the initial compile or an Amendment-bound replan.  Keeping one spec per batch
# lets a historical `batch` and a different `next_batch` successor carry
# different family, mode, dependencies, and confirmation policy.
# After initial materialization, do not edit this canonical document first.
# Stage a complete same-scope copy under `.cambium/deltas/replans/`; only
# `compile_queue.py --apply-replan` may publish it together with Queue/Progress.
batch_specs:
  - id: "B1"
    family: "Example Family"
    order_hint: 1
    source_route: "R03"
    execution_mode: concurrent-worker
    depends_on: []
    confirmation_required: false

# Canonical cross-run state for the K00/08 maintenance candidate pool. Build
# tasks keep this list empty. A maintenance task copies the current run's
# complete candidate records from its frozen budget manifest; Queue contains
# only records whose selection is selected.
