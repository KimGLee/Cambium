# =============================================================================
# External scan watermark template (machine-readable state layer; the template is the schema doc)
# Owner standard: "06 Knowledge Intake and Evolution/03 Source-to-Knowledge Pipeline.md"
#            (Stage 1 incremental scan semantics: by default only material
#             newer than scanned_until is scanned; the watermark records
#             covered sources and coverage cutoff dates per domain section;
#             advanced together with the Ledger at batch close -- see
#             02/05 Batch Policy)
# Instance location: Tools/state/watermark.yaml (advanced when maintenance/
#            source batches close; never hand-edited)
#
# Only the restricted YAML subset is allowed (parseable by Tools/kblib.py parse_yaml_subset):
#   - `key: value` scalars (string/number/boolean/null, quoted strings, inline `[]`);
#   - `- item` lists indented under `key:`; list items may be a one-level flat map;
#   - two-level indented nested maps.
#   Not allowed: anchors/aliases, block scalars (| >), flow maps {}, tags, multi-document.
# =============================================================================

updated_at: "2026-07-21T00:00:00Z"  # time the watermark was last advanced (batch close point)
last_run_id: "kb-maint-2026-xx-B1"  # identifier of the batch that advanced this watermark; corresponds to the Progress Ledger's task/batch id (02/05)

domains:                            # one section per domain (domain vocabulary owner: 08/01)
  agent:                            # one section per domain onboarded to incremental scanning
    scanned_until: "2026-07-01"     # environment scan coverage cutoff date for this domain; the next scan defaults to material newer than this date only
    sources_covered:                # sources already covered for this domain
      - source: "Anthropic engineering blog"  # source identifier (publication channel/feed/organization, matching the Source Note's identity)
        covered_until: "2026-07-01"           # date this source is covered up to (may lag behind the domain's scanned_until)
      - source: "OpenAI research index"
        covered_until: "2026-06-15"
  llm:
    scanned_until: "2026-06-20"
    sources_covered:
      - source: "arXiv cs.CL weekly sweep"
        covered_until: "2026-06-20"
