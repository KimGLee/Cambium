# =============================================================================
# AuditPlan template (machine-readable state layer; the template is the schema doc)
# Owner standard: "12 Quality Assurance/07 Audit Evidence Reuse and Invalidation.md"
#   -- Incremental Audit Planning: generate an AuditPlan at the start of each
#      batch and before closing it; freeze snapshot -> diff -> resolve
#      direct/dependency invalidation -> partition the checks
#      -> run them and produce new receipts -> reconcile -> close only when
#      required invalidations reach zero.
#
# Only the restricted YAML subset is allowed (parseable by Tools/kblib.py parse_yaml_subset):
#   - `key: value` scalars (string/number/boolean/null, quoted strings, inline `[]`);
#   - `- item` lists indented under `key:`;
#   - list items may be a one-level flat map; two-level indented nested maps.
#   Not allowed: anchors/aliases, block scalars (| >), flow maps {}, tags, multi-document.
# =============================================================================

generated_at: "2026-07-21T00:00:00Z"  # AuditPlan generation time = artifact/contract snapshot freeze time (12/07 step 1)

changed_objects:                   # objects changed relative to the latest accepted snapshot (12/07 step 2; input to invalidation)
  - "Topics/Example Topic.md"

reused_receipts:                   # historical receipts that passed the Reuse Gate (12/07: reuse must record reused_receipt_id and a reuse reason)
  - receipt_id: "audit-check_links-20260701T000000Z-0001"  # the reused receipt_id
    reason: "artifact/dependency/contract fingerprints all unchanged; acceptance predicate unchanged"  # reuse reason (must not just say "already checked before")

invalidated_receipts:              # receipts judged invalid in this round (12/07 Direct / Dependency Invalidation)
  - receipt_id: "audit-check_vocab-20260701T000000Z-0002"  # the invalidated receipt_id
    reason: "file content within scope changed (direct invalidation)"  # invalidation reason, pointing to the 12/07 invalidation clause

required_checks:                   # check partitions that must run this round (the six partitions of 12/07 step 4)
  - check: "check_links full-vault"          # check item and scope
    partition: mandatory-full-deterministic  # partition vocabulary owner: 12/07 (mandatory-full-deterministic/changed-scope-deterministic/invalidated-semantic-review/high-risk-targeted-review/bounded-sampling/reusable-evidence)
  - check: "content_and_depth review of changed pages"
    partition: invalidated-semantic-review
