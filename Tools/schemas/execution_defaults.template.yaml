# =============================================================================
# Profile-form placeholder registry (machine-readable; the template is the
# schema doc).
#
# MOVED OUT (2026-08-06): the closed execution-default rule set that used to
# live here is a rule carrier, so it now lives under kernel/ (CC BY 4.0) per
# the licensing scope in LICENSE.md. This file keeps only executor-side
# configuration: the literal placeholder strings the shipped
# `profiles/_template/` form uses.
#
# Block-by-block relocation table:
#
#   original block         -> now at
#   ---------------------------------------------------------------------
#   overridable            -> kernel/K00 Standards Control/execution-defaults-base.yaml#overridable
#   constitutional         -> kernel/K00 Standards Control/execution-defaults-base.yaml#constitutional
#   reserved_profile_ids   -> stays here (shipped-form placeholder inventory, not a rule)
#   unfilled_sentinel      -> stays here (shipped-form placeholder token, not a rule)
#   schema_version         -> stays here; the kernel registry carries its own
#
# The kernel registry is registered by
# "kernel/K00 Standards Control/09 Default Constraints Snapshot.md" and owned
# per "kernel/K00 Standards Control/11 Standards Map and Rule Registry.md".
# `Tools/governance/profile/check_profile.py` reads the closed item sets from
# there and the two placeholder blocks below from here;
# `Tools/execution/task_runtime/check_queue.py` and
# `Tools/execution/audit/check_proof.py` read only the placeholder blocks below.
#
# Only the restricted YAML subset is allowed (parseable by
# Tools/platform/common/kblib.py parse_yaml_subset):
#   - `key: value` scalars (string/number/boolean/null, quoted strings, inline `[]`);
#   - `- item` lists indented under `key:`; list items may be a one-level flat map.
#   Not allowed: anchors/aliases, block scalars (| >), non-empty flow maps, tags, multi-document.
#   The exact empty mapping `{}` is allowed where a schema requires an explicit empty state.
# =============================================================================

schema_version: 1

# Placeholder profile_id values that a filled profile must not carry.
reserved_profile_ids:
  - "_template"
  - "template"
  - "example"
  - "REPLACE-ME"
  - "your-profile-id"
  - "TODO"

# The unfilled-answer sentinel used by a copied form. A filled profile must not
# retain it.
unfilled_sentinel: "TODO(profile)"
