# =============================================================================
# Progress Ledger template (canonical task-level state)
# Owner standard: "kernel/K13 Task Runtime and Execution Control/07 Progress Ledger Contract.md"
#
# The Progress Ledger owns the Task Contract, task state, Amendments,
# checkpoints, guidance reconciliation, and terminal-audit state. It references
# Required Queue by revision and fingerprint; it does not duplicate batch
# membership, order, lifecycle, active batches, or merge queues.
# Only the restricted YAML subset accepted by Tools/kblib.py is allowed.
# =============================================================================

schema_version: 1
task_id: "kb-build-2026-xx"
task_state: active
task_transition_receipts:
  - "audit-update_task-..."
required_queue_path: ".cambium/state/required_queue.yaml"
queue_revision: 1
queue_state_revision: 0
required_queue_sha256: "sha256:replace-after-queue-materialization"
# Null only while the initialized Queue is empty. The first successful
# compile_queue --apply writes the unique queue_structure receipt id here;
# later lifecycle/replan writes never replace it.
initial_queue_receipt: "audit-compile_queue-..."

contract:
  contract_version: "c1"
  # Explicitly select one completion model. Build tasks freeze a
  # completion-candidate and close through Terminal Proof. Maintenance tasks
  # close directly from active after the bounded maintenance completion gate.
  completion_semantics: build
  objective: "Build and validate the declared knowledge corpus."
  exclusions: []
  scope_version: "s1"
  concurrency_cap: 3
  standards_version: ""
  selected_profile_manifest: ""
  selected_route_ids:
    - "R01"
    - "R07"
  selected_card_paths:
    - "kernel/Cards/R01 Core Bootstrap Card.md"
    - "kernel/Cards/R07 Long-running Execution Card.md"
  selected_profile_route_ids: []
  selected_read_sets:
    - "kernel/Read Sets/R07 Long-running Execution Read Set.md"
  loaded_module_paths: []
  minimum_run_until: ""
  checkpoint_at: ""
  hard_stop_at: ""
  completion_gate: "guidance pending=0 AND required_authoring_gaps=0 AND remaining_required_work_units=0 AND unresolved_invalidations=0 AND all applicable gates passed"

checkpoint:
  recorded_at: "2026-07-05T10:00:00Z"
  summary: "task activated after Required Queue materialization"
  task_state: active
  task_transition_receipt: "audit-update_task-..."
  coverage_sha256: "sha256:replace-with-checkpoint-coverage-bytes"
  required_queue_sha256: "sha256:replace-with-checkpoint-queue-bytes"
  queue_revision: 1
  queue_state_revision: 0

terminal_audit:
  state: not-started
  terminal_proof_path: null
  terminal_proof_sha256: null
  terminal_proof_receipt: null
  queue_check_receipt: null

# Mutually exclusive with terminal_audit. For completion_semantics=build this
# block remains not-applicable. For completion_semantics=maintenance it begins
# pending and records the canonical maintenance gate plus the three evidence
# receipts consumed by that gate.
maintenance_completion:
  state: not-applicable
  completion_gate_receipt: null
  budget_manifest_receipt: null
  ledger_advance_receipt: null
  watermark_advance_receipt: null

amendments:
  # A generic contract/guidance Amendment may use only the common fields.
  - id: "A-CONTRACT-001"
    date: "2026-07-05"
    summary: "changed the checkpoint boundary"
    status: verified
    writeback_done: true
  # A same-scope Queue replan additionally binds operation=queue-replan,
  # a repository-contained `.cambium/deltas/replans/*.coverage.yaml` proposal
  # path/SHA, exact affected_pages/affected_batches, unchanged scope, both
  # Queue revision edges, and the exact replan_diff_sha256. It starts
  # approved/writeback_done=false; `register_amendment.py` is the only writer
  # of that executable row and records approval_reference plus the current
  # registration_receipt. Successful compile_queue --apply-replan
  # changes it to verified/true and records transaction_id/receipt plus the
  # resulting Coverage and Queue SHAs. Canonical Coverage is never edited
  # before this guarded three-state transaction.
  # A scope-replan or cancel-batch instead mirrors every field in
  # amendment_plan.template.yaml, including plan_path/plan_sha256 fixed at
  # registration. apply_amendment.py then records, in addition:
  # transaction_id, transaction_sequence,
  # previous_transaction_commit_receipt, plan_path, plan_sha256, and
  # verification_receipt. The downstream commit receipt consumes the exact
  # registration_receipt. Pending registration is current authorization;
  # after verified write-back the same receipt is history only. Cross-Ledger
  # transaction history is append-only.

# Append-only active-task Standards/profile adoption history.  Each record is
# written only by Tools/adopt_standards.py and binds the immutable plan, all
# three before fingerprints, the after Coverage/Queue fingerprints, and the
# explicit gate reruns required under the adopted version.  Its commit receipt
# binds the complete after image, including Progress, without a self-containing
# after-Progress hash.  It does not duplicate task or batch lifecycle.
standards_adoptions: []

# Guidance records use the kernel's own field names.  `disposition` is one of
# the nine K13/05 dispositions; `status` is one of the K13/06 status values.
guidance_queue:
  - guidance_id: "G-001"
    disposition: apply-to-current-batch
    status: verified
