# Closed policy for the host-neutral agent call surface.
#
# `exposure: mcp` means the CLI may be projected into the MCP tool table.
# Every exposed tool binds one declared repository-root argument to the host's
# CAMBIUM_WORKSPACE_ROOT.  Each argparse argument is closed as exactly that
# workspace argument, one read/write path, or one ordinary value. Path defaults
# and overrides narrow containment to a registered namespace or exact artifact.
# A CLI-only tool may retain an external-write workflow, but that effect is
# never inherited by MCP merely because the CLI happens to declare it.
schema_version: 2
artifact: agent-interface-policy
consumption_defaults:
  read: snapshot
  write: replace
  read-write: transaction
path_defaults:
  - argument: receipts
    constraint: namespace
    value: .cambium/receipts
    suffixes: [.jsonl]
    consumption: append
path_overrides:
  - tool: check_boundary_contract
    argument: contract
    constraint: exact
    value: Tools/page_contract.yaml
    suffixes: []
  - tool: check_page_contract
    argument: contract
    constraint: exact
    value: Tools/page_contract.yaml
    suffixes: []
  - tool: render_boundary_projection
    argument: contract
    constraint: exact
    value: Tools/page_contract.yaml
    suffixes: []
  - tool: check_profile
    argument: interface
    constraint: exact
    value: profiles/README.md
    suffixes: []
  - tool: check_profile
    argument: defaults
    constraint: exact
    value: Tools/schemas/execution_defaults.template.yaml
    suffixes: []
  - tool: check_profile
    argument: execution_defaults
    constraint: exact
    value: kernel/K00 Standards Control/execution-defaults-base.yaml
    suffixes: []
  - tool: check_proof
    argument: ledger
    constraint: exact
    value: .cambium/state/coverage_ledger.yaml
    suffixes: []
  - tool: check_proof
    argument: progress_ledger
    constraint: exact
    value: .cambium/state/progress_ledger.yaml
    suffixes: []
  - tool: check_proof
    argument: template
    constraint: exact
    value: Tools/schemas/terminal_proof.template.yaml
    suffixes: []
  - tool: check_vocab
    argument: vocab
    constraint: exact
    value: Tools/vocab.yaml
    suffixes: []
  - tool: compile_queue
    argument: output
    constraint: namespace
    value: .cambium
    suffixes: [.yaml]
  - tool: render_queue
    argument: output
    constraint: namespace
    value: .cambium/reports
    suffixes: [.md]
  - tool: stamp_cards
    argument: cards_dir
    constraint: exact
    value: kernel/Cards
    suffixes: []
  - tool: update_queue
    argument: delta_path
    constraint: namespace
    value: .cambium/deltas
    suffixes: [.yaml]
path_activation_overrides:
  - tool: adopt_standards
    argument: receipts
    active_when_any: [apply]
    inactive_when_any: []
  - tool: apply_amendment
    argument: receipts
    active_when_any: [apply]
    inactive_when_any: []
  - tool: apply_contract_amendment
    argument: receipts
    active_when_any: [apply]
    inactive_when_any: []
  - tool: apply_delta
    argument: receipts
    active_when_any: [apply]
    inactive_when_any: []
  - tool: apply_metadata_transition
    argument: receipts
    active_when_any: [apply]
    inactive_when_any: []
  - tool: apply_profile_adoption
    argument: receipts
    active_when_any: [apply]
    inactive_when_any: []
  - tool: apply_task_plan
    argument: receipts
    active_when_any: [apply]
    inactive_when_any: []
  - tool: compile_queue
    argument: receipts
    active_when_any: [apply, apply_replan]
    inactive_when_any: []
  - tool: compile_queue
    argument: replan_diff
    active_when_any: [apply_replan]
    inactive_when_any: []
  - tool: record_batch_judgment
    argument: receipts
    active_when_any: [apply]
    inactive_when_any: []
  - tool: record_corpus_acceptance
    argument: receipts
    active_when_any: [apply]
    inactive_when_any: []
  - tool: record_gate_attestation
    argument: receipts
    active_when_any: [apply]
    inactive_when_any: []
  - tool: record_gate_result
    argument: receipts
    active_when_any: [apply]
    inactive_when_any: []
  - tool: register_amendment
    argument: receipts
    active_when_any: [apply]
    inactive_when_any: []
  - tool: render_queue
    argument: output
    active_when_any: []
    inactive_when_any: [stdout]
  - tool: seal_receipts
    argument: receipts
    active_when_any: [apply]
    inactive_when_any: [reconcile, verify]
  - tool: update_queue
    argument: receipts
    active_when_any: [apply]
    inactive_when_any: []
  - tool: update_task
    argument: receipts
    active_when_any: [apply]
    inactive_when_any: []
