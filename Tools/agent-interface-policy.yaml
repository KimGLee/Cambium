# Closed policy for the host-neutral agent call surface.
#
# `exposure: mcp` means the CLI may be projected into the MCP tool table.
# Every exposed tool binds one declared repository-root argument to the host's
# CAMBIUM_WORKSPACE_ROOT.  Each argparse argument is closed as exactly that
# workspace argument, one read/write path, or one ordinary value. Path defaults
# and overrides narrow containment to a registered namespace or exact artifact.
# Runtime paths bind the stable `runtime_path_id` owned by
# Tools/execution/task_runtime/runtime_paths.py. Other caller-supplied paths
# retain a literal `value` or the default contained-workspace constraint.
# Component-owned paths are resolved by the component's own machine contract,
# not rebound through the agent-interface policy. Every row carries exactly
# one source form.
# A CLI-only tool may retain an external-write workflow, but that effect is
# never inherited by MCP merely because the CLI happens to declare it.
schema_version: 6
artifact: agent-interface-policy
host_transports:
  - transport_id: cambium-mcp-stdio
    protocol: mcp
    mode: stdio
    host_exposure: shared-bridge
    module: mcp_server
    path: Tools/mcp_server.py
    server_name: cambium
    command: python3
consumption_defaults:
  read: snapshot
  write: replace
  read-write: transaction
path_defaults:
  - argument: receipts
    constraint: namespace
    runtime_path_id: receipt-root
    suffixes: [.jsonl]
    consumption: append
