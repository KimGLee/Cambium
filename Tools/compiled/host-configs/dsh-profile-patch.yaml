mcpServers:
  cambium:
    command: python3
    args:
      - <CAMBIUM_DISTRIBUTION_ROOT>/Tools/mcp_server.py
    cwd: <CAMBIUM_DISTRIBUTION_ROOT>
    toolCallTimeoutMs: 120000
    failOnStartupError: true
    reconnect:
      enabled: true
      maxAttempts: 3
      delayMs: 1000
