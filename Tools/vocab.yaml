# =============================================================================
# 受控词表编译产物（machine-readable vocabulary）
# compiled_from: Knowledge Base Standards v2.3
# 各词表 owner 文件（权威定义，本文件只是照抄的编译产物）：
#   type / domain                  -> "08 Metadata and Status/01 Frontmatter and Core Vocabularies.md"
#   scope / level / depth / priority -> "08 Metadata and Status/02 Scope Level Depth and Priority.md"
#   authoring_status / interview_status / learning_status / coverage_disposition
#                                  -> "08 Metadata and Status/03 Status Axes.md"
#   evidence_maturity              -> "08 Metadata and Status/04 Evidence and Relationship Metadata.md"
#   volatility                     -> "08 Metadata and Status/05 Review Source and Migration Metadata.md"
#                                     （三档定义、domain 默认派发与复验间隔；词表登记在 08/01）
#   lifecycle                      -> "03 Note Types and Ownership/03 Split and Duplication Policy.md"
#                                     （退役/合并流程 owner；词表登记在 08/01）
#   task_state（Progress Ledger 字段，非页面 frontmatter） -> "02 Build Execution/01 Contract Time and Task State.md"
# 修订 owner 标准文件后必须重新生成本文件；不得只改本文件而不改 owner。
#
# 仅允许受限 YAML 子集语法（Tools/kblib.py parse_yaml_subset 可解析）。
# =============================================================================

