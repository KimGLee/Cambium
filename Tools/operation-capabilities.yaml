# Tool capability implementation registry.
#
# `implementation_owner` is the one module that defines the capability.
# `writers` lists outer transactions that use it to change canonical adopter
# state or governed pages; `checkers` lists read-only verdict/evidence
# producers; `consumers` lists other callers. These roles do not grant
# authority -- they make implementation ownership and dependency direction
# machine-checkable. A `projection` capability additionally closes the stable
# adopter-runtime object IDs it can consume; Profile declarations reference
# the capability and those object IDs, never these implementation paths or a
# current `.cambium` spelling.

schema_version: 2

capabilities:
  - capability_id: project-page-state-v2
    kind: writer
    capability_version: 2.0.0
    implementation_owner: Tools/project_page_state.py
    writers:
      - Tools/apply_amendment.py
      - Tools/apply_delta.py
      - Tools/apply_metadata_transition.py
      - Tools/apply_task_plan.py
      - Tools/update_queue.py
    checkers:
      - Tools/check_batch_close.py
    consumers:
      - Tools/metadata_property_state.py
    operations:
      - field: authoring_status
        transition: owner-to-page-projection
        source_adapter: coverage-row-value-v1
      - field: coverage_disposition
        transition: owner-to-page-projection
        source_adapter: coverage-row-value-v1
      - field: last_content_modified
        transition: owner-to-page-projection
        source_adapter: coverage-property-state-v1
      - field: last_reviewed
        transition: owner-to-page-projection
        source_adapter: coverage-property-state-v1
      - field: next_batch
        transition: owner-to-page-projection
        source_adapter: coverage-row-value-v1
      - operation: profile-extension-enum-owner-projection-v1

  - capability_id: metadata-transition-integrator-v1
    kind: writer
    capability_version: 1.0.0
    implementation_owner: Tools/metadata_property_state.py
    writers:
      - Tools/apply_delta.py
      - Tools/apply_metadata_transition.py
      - Tools/update_queue.py
    checkers:
      - Tools/check_batch_close.py
    consumers: []
    operations:
      - field: last_content_modified
        transition: semantic-content-change
        source_adapter: content-change-event-v1
      - field: last_reviewed
        transition: review-completed
        source_adapter: current-review-receipt-value-v1
      - field: last_reviewed
        transition: semantic-content-change
        source_adapter: content-change-event-v1

